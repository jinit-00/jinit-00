name: 3D Contribution Skyline
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate 3D Contribution
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: jinit-00

      - name: Commit and push to output branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate 3D skyline"
          branch: output
          create_branch: true
